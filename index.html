<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SIQA — Sistema Inteligente de Qualidade do Ar">
  <title>SIQA - Sistema Inteligente de Qualidade do Ar</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">S</div><div><strong>SIQA</strong><small>Qualidade do Ar</small></div></div>
